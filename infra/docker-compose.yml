name: portunus

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set in infra/.env}
    profiles: [core, full]
    environment:
      POSTGRES_USER: portunus
      POSTGRES_PASSWORD: portunus_dev_only
      POSTGRES_DB: portunus
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set in infra/.env}
    profiles: [core, full]
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-provider:
    build:
      context: ..
      dockerfile: apps/mock-provider/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE must be set in infra/.env}
    image: portunus/mock-provider:dev
    profiles: [core, full]
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - '127.0.0.1:${MOCK_HOST_PORT:-3001}:3001'

volumes:
  postgres-data:
  redis-data:
